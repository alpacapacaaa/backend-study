[package]
name = "todo-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "fs"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"]}
uuid = { version = "1", features = ["v4", "serde"] }