openapi: 3.0.3

# ============================================================================
# 백엔드 전반 학습 스터디 — API 명세
#
# 이 문서는 스터디에서 사용하는 유일한 API contract입니다.
# 모든 참여자는 자신이 선택한 언어/프레임워크(Go+Echo, Spring Boot, 등)로
# 이 명세를 "그대로" 구현해야 하며, 프론트엔드(frontend/)는 이 명세만 보고
# 어떤 백엔드 구현체와도 연결될 수 있어야 합니다.
#
# ⚠️ CORS 정책 (필수)
#   모든 백엔드 구현체는 반드시 프론트엔드 origin(http://localhost:3000)을
#   CORS로 허용해야 합니다.
#     - Access-Control-Allow-Origin: http://localhost:3000
#     - Access-Control-Allow-Methods: GET, POST, PATCH, PUT, DELETE, OPTIONS
#     - Access-Control-Allow-Headers: Content-Type, Authorization
#   (2주차 이후 인증 기능이 추가되면 Authorization 헤더 허용이 반드시 필요합니다.)
#
# ⚠️ 에러 응답 포맷 (필수, 전 엔드포인트 공통)
#   성공/실패와 무관하게 에러가 발생하면 항상 아래 형태의 JSON 하나로만 응답합니다.
#     { "error": "사람이 읽을 수 있는 에러 메시지" }
#   HTTP 상태 코드로 에러의 종류(400/401/403/404/409/500 등)를 구분하고,
#   바디의 형태 자체는 절대 바꾸지 않습니다. (예: "errors" 배열, "message" 필드 등 금지)
#
# ⚠️ 날짜/시간 포맷 (필수)
#   모든 날짜/시간 값은 ISO 8601, UTC(Z) 형식의 문자열로 표현합니다.
#     예) 2026-07-27T10:00:00Z
#   타임존을 생략하거나 로컬 시간으로 응답하지 않습니다.
# ============================================================================

info:
  title: 백엔드 스터디 API
  description: |
    5주간 난이도 순으로 확장되는 스터디용 API 명세입니다.
    현재는 1주차(Todo API, 필터/정렬 조회, 파일 업로드/다운로드) 범위만 정의되어 있으며,
    매주 새로운 기능이 이어서 추가됩니다.
  version: "1.0.0"

# 각자 다른 포트를 사용하는 것을 전제로 예시 서버를 여러 개 등록합니다.
# 실제 접속 주소는 프론트엔드의 NEXT_PUBLIC_API_URL 환경변수로 지정합니다.
servers:
  - url: http://localhost:8080
    description: 예시 - Go(Echo) 구현체
  - url: http://localhost:8081
    description: 예시 - Spring Boot 구현체
  - url: http://localhost:8082
    description: 예시 - 그 외 구현체 (본인 포트로 자유롭게 변경)

tags:
  - name: Todos
    description: |
      학습 포인트: 가장 기본적인 CRUD API 설계, REST 리소스 모델링,
      요청/응답 검증, 상태 코드 사용법을 연습합니다.
  - name: Files
    description: |
      학습 포인트: multipart/form-data 파싱, 서버 측 파일 저장,
      스트리밍 응답(다운로드), 파일 메타데이터 관리를 연습합니다.

paths:
  # --------------------------------------------------------------------------
  # 1. Todo API — 생성/조회/수정/삭제
  #    + 2. 필터/정렬 조회 (완료 여부 필터, 날짜순 정렬)
  #    같은 리소스(/todos)에 대한 기능이라 경로를 통합해서 정의합니다.
  # --------------------------------------------------------------------------
  /todos:
    get:
      tags: [Todos]
      summary: Todo 목록 조회 (필터/정렬 지원)
      description: |
        학습 포인트: 쿼리 파라미터 기반 필터링/정렬, DB WHERE/ORDER BY 절 설계,
        페이지네이션 없이도 목록 API의 계약을 명확히 하는 법을 연습합니다.
      operationId: listTodos
      parameters:
        - name: completed
          in: query
          description: 완료 여부로 필터링. 생략하면 전체 조회.
          required: false
          schema:
            type: boolean
        - name: sort
          in: query
          description: 정렬 기준 필드. 기본값은 createdAt.
          required: false
          schema:
            type: string
            enum: [createdAt, dueDate]
            default: createdAt
        - name: order
          in: query
          description: 정렬 방향. 기본값은 desc(최신순).
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Todo 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Todo"
              examples:
                default:
                  value:
                    - id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                      title: "OpenAPI 명세 작성하기"
                      description: "1주차 명세 초안 작성"
                      completed: false
                      dueDate: "2026-08-01T00:00:00Z"
                      createdAt: "2026-07-27T10:00:00Z"
                      updatedAt: "2026-07-27T10:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [Todos]
      summary: Todo 생성
      operationId: createTodo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TodoCreateRequest"
            examples:
              default:
                value:
                  title: "OpenAPI 명세 작성하기"
                  description: "1주차 명세 초안 작성"
                  dueDate: "2026-08-01T00:00:00Z"
      responses:
        "201":
          description: 생성된 Todo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /todos/{todoId}:
    parameters:
      - name: todoId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Todos]
      summary: Todo 단건 조회
      operationId: getTodo
      responses:
        "200":
          description: Todo 상세
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      tags: [Todos]
      summary: Todo 수정 (부분 업데이트)
      description: |
        요청에 포함된 필드만 갱신합니다. title/description/completed/dueDate 모두 선택적입니다.
      operationId: updateTodo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TodoUpdateRequest"
            examples:
              완료처리:
                value:
                  completed: true
      responses:
        "200":
          description: 수정된 Todo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [Todos]
      summary: Todo 삭제
      operationId: deleteTodo
      responses:
        "204":
          description: 삭제 성공 (본문 없음)
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # --------------------------------------------------------------------------
  # 3. 파일 업로드/다운로드 — 이미지 업로드받아 저장하고 다시 받기
  # --------------------------------------------------------------------------
  /files:
    post:
      tags: [Files]
      summary: 이미지 파일 업로드
      description: |
        학습 포인트: multipart/form-data 파싱, 파일 확장자/MIME 타입 검증,
        디스크(또는 오브젝트 스토리지)에 저장 후 접근 가능한 식별자 발급.
      operationId: uploadFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: 업로드할 이미지 파일 (jpg, jpeg, png, gif, webp)
              required: [file]
      responses:
        "201":
          description: 업로드된 파일 메타데이터
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileMeta"
        "400":
          description: |
            잘못된 요청 (파일 누락, 허용되지 않는 확장자/MIME 타입, 용량 초과 등)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /files/{fileId}:
    parameters:
      - name: fileId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Files]
      summary: 업로드한 파일 다운로드/조회
      description: |
        원본 바이너리를 그대로 스트리밍합니다. Content-Type은 업로드 시점의
        MIME 타입을 그대로 반환해야 합니다.
      operationId: downloadFile
      responses:
        "200":
          description: 파일 바이너리
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [Files]
      summary: 업로드한 파일 삭제
      operationId: deleteFile
      responses:
        "204":
          description: 삭제 성공 (본문 없음)
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  schemas:
    Todo:
      type: object
      required: [id, title, completed, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: "OpenAPI 명세 작성하기"
        description:
          type: string
          nullable: true
          example: "1주차 명세 초안 작성"
        completed:
          type: boolean
          default: false
        dueDate:
          type: string
          format: date-time
          nullable: true
          description: ISO 8601, UTC. 예) 2026-08-01T00:00:00Z
        createdAt:
          type: string
          format: date-time
          description: ISO 8601, UTC. 예) 2026-07-27T10:00:00Z
        updatedAt:
          type: string
          format: date-time
          description: ISO 8601, UTC. 예) 2026-07-27T10:00:00Z

    TodoCreateRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          example: "OpenAPI 명세 작성하기"
        description:
          type: string
          nullable: true
        dueDate:
          type: string
          format: date-time
          nullable: true

    TodoUpdateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        completed:
          type: boolean
        dueDate:
          type: string
          format: date-time
          nullable: true

    FileMeta:
      type: object
      required: [id, filename, mimeType, size, url, createdAt]
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
          example: "profile.png"
        mimeType:
          type: string
          example: "image/png"
        size:
          type: integer
          description: 바이트 단위 파일 크기
          example: 102400
        url:
          type: string
          description: 다운로드에 사용할 상대 경로. GET /files/{fileId} 와 동일한 값.
          example: "/files/3fa85f64-5717-4562-b3fc-2c963f66afa6"
        createdAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: "요청한 리소스를 찾을 수 없습니다."

  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: 서버 내부 오류
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
