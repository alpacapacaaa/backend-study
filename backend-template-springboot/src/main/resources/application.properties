spring.application.name=backend-template-springboot

# 본인 포트로 바꾸세요. openapi.yaml의 servers 목록에도 추가해두면 좋습니다.
# (다른 참여자와 겹치지 않는 포트를 쓰세요)
server.port=8080

# 파일 업로드 용량 제한 (openapi.yaml Files 명세와 맞춤)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 정의되지 않은 경로도 공통 에러 포맷({ "error": ... })으로 응답하기 위한 설정
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# JWT 서명용 시크릿 키. HS256은 최소 256비트(32바이트) 이상 권장 — 아래 값은 학습용
# 예시일 뿐이니 그대로 제출하지 말고 본인 값으로 바꾸세요. 운영 환경이라면 여기 대신
# 환경변수(JWT_SECRET)로 주입하는 게 정석입니다 (${JWT_SECRET:기본값} 형태로 참조 가능).
jwt.secret=change-this-to-a-long-random-secret-key-at-least-32-bytes
jwt.expiration-ms=86400000
